<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>الصفحة غير موجودة | عروض أسعار PLAN C</title>
<script>
  // GitHub Pages serves this for unknown paths: send the visitor into the app,
  // which shows its own 404 page for routes it doesn't know.
  (function () {
    var parts = location.pathname.split("/").filter(Boolean);
    var base = location.hostname.endsWith("github.io") && parts.length ? "/" + parts[0] + "/" : "/";
    var rest = location.pathname.slice(base.length);
    location.replace(base + "#/" + rest);
  })();
</script>
</head>
<body style="font-family:sans-serif;text-align:center;padding:15vh 16px;color:#14133a;background:#f4f5fa">
  <p>الصفحة غير موجودة. <a href="./" style="color:#05034d">العودة للرئيسية</a></p>
</body>
</html>
